<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Իմ հաշիվը</title><link rel="stylesheet" href="/static/auth.css?v=1"><style>body{display:block}.auth{margin:40px auto;width:min(620px,calc(100% - 30px))}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:10px}.good{color:var(--green)}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><main class="auth"><a href="/">← Գլխավոր էջ</a><p class="eyebrow">ԱՆՁՆԱԿԱՆ ՀԱՇԻՎ</p><h1 id="title">Իմ հաշիվը</h1><div class="row"><label>Լեզու<select id="language"><option value="hy">Հայերեն</option><option value="ru">Русский</option><option value="en">English</option></select></label><label>Հաշվի պայմանական գումար ($)<input id="balance" type="number" min="1" max="10000000" step="1"></label></div><label>Մեկ գործարքի ռիսկ (%)<input id="risk" type="number" min="0.1" max="5" step="0.1"></label><button id="save">Պահպանել</button><p id="message" class="error"></p><hr style="border-color:var(--line)"><h2>Telegram</h2><p id="telegram">Ստուգվում է…</p><button id="connect">Միացնել Telegram-ը</button><button id="disconnect" class="secondary">Անջատել Telegram-ը</button></main><script>
let account;const $=id=>document.getElementById(id);async function api(url,options){const r=await fetch(url,options),b=await r.json();if(r.status===401){location.replace('/login');throw Error('');}if(!r.ok)throw Error(b.detail||'Չստացվեց');return b;}
async function load(){account=await api('/api/account');$('title').textContent=account.username+' · Իմ հաշիվը';$('language').value=account.language;$('balance').value=account.balance;$('risk').value=account.risk_percent;$('telegram').textContent=account.telegram_connected?'✅ Telegram-ը միացված է':'Telegram-ը միացված չէ';$('telegram').className=account.telegram_connected?'good':'';$('connect').hidden=account.telegram_connected;$('disconnect').hidden=!account.telegram_connected;}
$('save').onclick=async()=>{try{await api('/api/account',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:$('language').value,balance:Number($('balance').value),risk_percent:Number($('risk').value)})});$('message').textContent='Պահպանված է։';await load();}catch(e){$('message').textContent=e.message;}};
$('connect').onclick=async()=>{try{const result=await api('/api/account/telegram/link',{method:'POST'});window.open(result.url,'_blank','noopener');$('message').textContent='Telegram-ում սեղմեք Start։ Կապը կհաստատվի մինչև 1 րոպեում։';let count=0;const timer=setInterval(async()=>{await load();if(account.telegram_connected||++count>30)clearInterval(timer);},2000);}catch(e){$('message').textContent=e.message;}};
$('disconnect').onclick=async()=>{try{await api('/api/account/telegram',{method:'DELETE'});await load();}catch(e){$('message').textContent=e.message;}};load().catch(e=>$('message').textContent=e.message);
</script></body></html>
