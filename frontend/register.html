<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Գրանցում · Trade Analysis</title><link rel="stylesheet" href="/static/auth.css?v=1"></head><body><main class="auth"><p class="eyebrow">TRADE ANALYSIS</p><h1>Ստեղծել անձնական հաշիվ</h1><p>Մուտքանունը գրեք լատինատառ։ Գաղտնաբառը պետք է ունենա առնվազն 8 նիշ։</p><form id="form" data-register="true"><label>Մուտքանուն<input name="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,32}" minlength="3" maxlength="32" required autofocus></label><label>Գաղտնաբառ<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>Կրկնել գաղտնաբառը<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button>Գրանցվել</button><p id="error" class="error" role="alert"></p></form><p class="links">Արդեն ունե՞ք հաշիվ։ <a href="/login">Մուտք գործել</a></p></main><script src="/static/js/auth.js?v=1"></script></body></html>
